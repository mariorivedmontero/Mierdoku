<style>
:root{--paper:#f7efe6;--ink:#2a2420;--muted:#7a6d63;--card:#fffaf3;--accent:#6b3fa0;--soft:#e3d5f2;--bub:#ebe3ef;--gen:#e0dcef;--vic:#efe0dc;--photo:#fff;--sticky:#f6f0b8;--nbg:#fbf8f4;--nblk:#ece6df;--nline:#d9d2ca;--nwall:#6d655e;--wall:#2a2420;--red:#b5443a;--on:#fff}
body.t-oceano{--paper:#eaf2f7;--card:#f7fbfd;--accent:#1f5f8b;--soft:#cfe3f1;--bub:#dceaf4;--gen:#d3e2ef;--vic:#f3dedb;--sticky:#fdf3c4}
body.t-bosque{--paper:#edf3e8;--card:#f9fcf6;--accent:#2f6b3a;--soft:#d3e7cf;--bub:#e0ecd9;--gen:#d7e6d0;--vic:#f1e0d9;--sticky:#f6f0b8}
body.t-fuego{--paper:#fbede3;--card:#fff8f2;--accent:#b5442a;--soft:#f7d4c4;--bub:#f6e1d6;--gen:#f1d9cc;--vic:#f2dcd6;--sticky:#fbefb4}
body.t-rosa{--paper:#fbedf2;--card:#fff8fb;--accent:#b0336f;--soft:#f5d0e1;--bub:#f4e0ea;--gen:#eed6e2;--vic:#f2dcd6;--sticky:#fbefc0}
body.dark{--paper:#181615;--ink:#f0e8df;--muted:#a39689;--card:#262321;--photo:#2f2b28;--sticky:#4a4420;--nbg:#24211f;--nblk:#2f2b28;--nline:#3a3532;--nwall:#8c847b;--wall:#0b0a09;--on:#181615;--bub:#2f2a35;--gen:#2b2833;--vic:#3a2826;--soft:#3d2f52}
body.dark{--accent:#b993ea}
body.dark.t-oceano{--accent:#6fb3e0;--soft:#1f3a4f;--bub:#1f2f3b;--gen:#1c2b37}
body.dark.t-bosque{--accent:#7cc487;--soft:#24402a;--bub:#22301f;--gen:#1f2d1d}
body.dark.t-fuego{--accent:#f08a63;--soft:#4d2a1e;--bub:#36251e;--gen:#32221b}
body.dark.t-rosa{--accent:#ef7fb4;--soft:#4c2338;--bub:#36222d;--gen:#32202a}
body.dark #plan .cell{box-shadow:inset 0 0 0 300px rgba(0,0,0,.36)}
body.dark .biglogo{mix-blend-mode:normal;border-radius:18px}
body.dark .lbl{background:#2f2b28;color:#f0e8df;border-color:#000}
body.dark a{color:var(--accent)}
.setsec{font-family:Oswald,sans-serif;letter-spacing:1px;text-transform:uppercase;font-size:13px;color:var(--muted);margin:16px 0 4px}
.tgl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:15px}
.sw2{width:50px;height:28px;border-radius:14px;background:var(--nline);position:relative;border:0;flex:0 0 auto}
.sw2::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw2.on{background:var(--accent)}.sw2.on::after{left:25px}
input[type=range]{width:100%;accent-color:var(--accent)}
.field{width:100%;font-family:Lora,serif;font-size:15px;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);margin:4px 0}
.acct{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:14px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.sw{width:54px;height:54px;border-radius:14px;border:3px solid transparent;display:flex;align-items:flex-end;justify-content:center;font-size:10px;padding-bottom:3px;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.sw.on{border-color:var(--ink)}
.seg{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;margin:8px 0 14px}
.seg button{flex:1;border:0;background:var(--card);color:var(--ink);padding:9px 6px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--on)}
.seg button+button{border-left:2px solid var(--ink)}
.daily{display:flex;align-items:center;gap:12px;background:var(--accent);color:var(--on);border-radius:14px;padding:12px 14px;margin:12px 0 4px;border:0;width:100%;text-align:left}
.daily b{font-family:Oswald,sans-serif;font-size:19px;letter-spacing:.5px;display:block}
.daily small{opacity:.9;font-size:12.5px}
.daily .ic{font-size:30px}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Lora,Georgia,serif}
button{font-family:inherit;cursor:pointer}

header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}

.btn{border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--on)}
.btn.ghost{border-color:transparent;background:transparent}

/* menu */
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}

.progress{font-size:14px;color:var(--muted)}
/* level */
h1.case{font-family:Oswald,sans-serif;font-weight:600;font-size:24px;text-align:center;margin:6px 0 2px}
p.intro{text-align:center;font-size:14px;color:var(--muted);margin:0 0 12px;font-style:italic}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{display:flex;gap:8px;align-items:flex-start}
.photo{flex:0 0 auto;width:64px;background:var(--photo);padding:4px 4px 2px;border:1.5px solid #3a332d;box-shadow:2px 2px 0 rgba(0,0,0,.15);text-align:center;position:relative}

.photo .nm{font-family:Caveat,cursive;font-size:18px;line-height:1.05;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo .x{position:absolute;left:4px;right:4px;top:4px;height:52px;pointer-events:none}
.bubble{background:var(--bub);border-radius:12px;padding:7px 9px;font-size:13px;line-height:1.3;box-shadow:1px 2px 0 rgba(0,0,0,.08);flex:1}
.card.victim .bubble{background:var(--vic)}
.card.sel .photo{outline:3px solid var(--accent);outline-offset:2px}
.generals{margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.gen{display:flex;gap:8px;align-items:center;background:var(--gen);border-radius:12px;padding:8px 10px;font-size:13.5px}

.note{background:var(--sticky);font-family:Caveat,cursive;font-size:18px;padding:8px 12px;transform:rotate(-1deg);box-shadow:2px 3px 0 rgba(0,0,0,.1);margin-top:12px;line-height:1.15}
/* boards */
.boardTitle{display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px}
.boardTitle h2{font-family:Oswald,sans-serif;font-size:16px;letter-spacing:1px;margin:0;text-transform:uppercase}
.board{position:relative;display:grid;border:4px solid var(--wall);background:var(--wall);user-select:none;touch-action:manipulation}
.cell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:0 solid var(--wall)}
.ob{font-size:calc(var(--cs)*.58);line-height:1;filter:saturate(.85)}
.cell.block::before{content:'';position:absolute;inset:0;background:rgba(60,40,20,.10)}
.table{width:78%;height:78%;background:linear-gradient(#d7a85a,#b8873f);border:2px solid #6e4e22;border-radius:3px}
.rug{position:absolute;inset:12%;border-radius:4px;background:repeating-linear-gradient(45deg,#c96f6f 0 4px,#d98a8a 4px 8px);opacity:.55}
.lvl{display:block}
@media (orientation: landscape) and (min-width: 640px){

 .bubble{font-size:12.5px}

 .sNotes{grid-area:notes;grid-template-areas:"t t" "m b" "c b";grid-template-rows:auto auto 1fr}
 .sPlan .boardTitle,.sNotes .boardTitle{grid-area:t;margin:0 0 4px}
 .boardTitle h2{font-size:13px}
 .boardTitle .btn{font-size:12px}
 .sPlan .hintline,.sNotes .hintline{display:none}
 .sPlan .chips{grid-area:c;flex-direction:column;flex-wrap:nowrap;margin:0;gap:4px}
 .sPlan .chip{padding:0 6px 0 1px;font-size:11px;border-width:1.5px;gap:3px}.sPlan .chip .em{width:19px;height:19px;font-size:12px}

}
.svob{width:78%;height:78%;display:block}
.legend{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:8px 10px;margin-top:10px}
.lgh{font-size:13px;font-weight:700;margin:4px 0}
.lgr{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}

.cell.conf::after{content:'';position:absolute;inset:0;background:rgba(200,40,40,.22);z-index:2}

function openLevel(n){cur=LEVELS.find(l=>l.n===n);selP=null;hist=[];render();window.scrollTo(0,0)}

function faceSVG(){return `<svg class="x" viewBox="0 0 10 10" preserveAspectRatio="none"><path d="M2 2L8 8M8 2L2 8" stroke="#c0392b" stroke-width=".8" opacity=".8"/></svg>`}

function render(){
  const L=cur,S=st(L.n),N=L.size;
  const P=L.people;
  const nav=`<div class="nav"><button class="btn ghost" onclick="menu()">‹ Casos</button>
   <div>${L.daily?'':(L.n>1?`<button class="btn ghost" onclick="openLevel(${L.n-1})">◀</button>`:'')+(L.n<LEVELS.length?`<button class="btn ghost" onclick="openLevel(${L.n+1})">▶</button>`:'')}<button class="btn ghost" onclick="howTo()">❓</button></div></div>`;
  let cards=P.map((p,i)=>`<div class="card ${p.victim?'victim':''} ${selP===i?'sel':''}" data-i="${i}" onclick="pick(${i})">
     <div class="photo"><div class="face" style="background:${p.bg}">${p.av}</div>${p.victim?faceSVG():''}<div class="nm">${p.name}</div></div>
     <div class="bubble">${p.clue}</div></div>`).join('');
  let gens=L.generals.map(g=>`<div class="gen"><span class="mg">🔍</span><span>${g}</span></div>`).join('');
  const chips=P.map((p,i)=>`<button class="chip ${selP===i?'on':''} ${S.place[i]?'placed':''}" data-i="${i}" onclick="pick(${i})"><span class="em" style="background:${p.bg}">${p.av}</span>${p.name[0]}</button>`).join('');
  const toolsL=['x','o'].concat(P.map(p=>p.name[0]));
  const tools=toolsL.map(t=>`<button class="tool ${tool===t?'on':''}" data-t="${t}" onclick="setTool('${t}')">${t==='x'?'✕':t==='o'?'●':t}</button>`).join('')+`<button class="tool small ${tool==='e'?'on':''}" data-t="e" onclick="setTool('e')">Goma</button><button class="tool small" onclick="clearNotes()">Borrar todo</button>`;
  const modes=`<div class="modes"><button data-m="s" class="${nmode==='s'?'on':''}" onclick="setMode('s')">✏️<span class="mtx"> Letra pequeña</span></button><button data-m="b" class="${nmode==='b'?'on':''}" onclick="setMode('b')">🖊️<span class="mtx"> Letra grande</span></button></div>`;
  const opts=`<option value="">— elige —</option>`+P.filter(p=>!p.victim).map((p,i)=>`<option value="${i}" ${S.guess==i?'selected':''}>${p.name}</option>`).join('');
  app.innerHTML=`${nav}
  <h1 class="case">${L.daily?'📅 Caso del día':L.n+'. '+L.title}</h1>${L.daily?`<p class="intro" style="margin-bottom:2px"><b>${L.title}</b> · ${fmtDay(L.day)}</p>`:''}<p class="intro">${L.intro}</p>
  <div class="lvl"><div class="sInfo">
  <div class="cards">${cards}</div>
  ${gens?`<div class="generals">${gens}</div>`:''}
  ${L.n===1?`<div class="note">Coloca a cada sospechoso según su pista. Recuerda: una persona por fila y por columna. — El inspector</div>`:''}
  </div><div class="sPlan">
  <div class="boardTitle"><h2>Escena del crimen</h2><div><button class="btn ghost undo" style="padding:4px 8px" onclick="undo()">↶ Deshacer</button><button class="btn ghost" style="padding:4px" onclick="clearPlace()">↺ Vaciar</button></div></div>
  <p class="hintline" id="hl">${selP===null?'Toca a un sospechoso y luego una casilla para colocarlo. Toca a alguien del plano para quitarlo.':'Colocando a <b>'+P[selP].name+'</b>: toca una casilla.'}</p>
  <div class="chips">${chips}</div>
  <div class="board" id="plan"></div>

function walls(L,r,c){
  const g=L.grid,N=L.size,a=g[r][c];
  const w=(rr,cc)=>rr<0||cc<0||rr>=N||cc>=N?0:(g[rr][cc]!==a?3:.5);
  return {t:w(r-1,c),l:w(r,c-1),b:w(r+1,c),r:w(r,c+1)};
}
function cellBase(L,el,r,c,notes){
  const w=walls(L,r,c);
  el.style.borderTopWidth=(w.t===3?2:w.t?.5:0)+'px';
  el.style.borderLeftWidth=(w.l===3?2:w.l?.5:0)+'px';
  el.style.borderBottomWidth=(w.b===3?2:w.b?.5:0)+'px';
  el.style.borderRightWidth=(w.r===3?2:w.r?.5:0)+'px';
  if(!notes){
    el.style.borderColor=(w.t===3||w.l===3||w.b===3||w.r===3)?'var(--wall)':'rgba(0,0,0,.12)';
    // set individual colors
    el.style.borderTopColor=w.t===3?'var(--wall)':'rgba(0,0,0,.13)';
    el.style.borderLeftColor=w.l===3?'var(--wall)':'rgba(0,0,0,.13)';
    el.style.borderBottomColor=w.b===3?'var(--wall)':'rgba(0,0,0,.13)';
    el.style.borderRightColor=w.r===3?'var(--wall)':'rgba(0,0,0,.13)';
  }else{
    el.style.borderTopColor=w.t===3?'var(--nwall)':'var(--nline)';
    el.style.borderLeftColor=w.l===3?'var(--nwall)':'var(--nline)';
    el.style.borderBottomColor=w.b===3?'var(--nwall)':'var(--nline)';
    el.style.borderRightColor=w.r===3?'var(--nwall)':'var(--nline)';
  }
}
const LAND=window.matchMedia?window.matchMedia('(orientation: landscape) and (min-width: 640px)'):{matches:false};
function sizeBoard(b,N){
  b.style.gridTemplateColumns=`repeat(${N},1fr)`;
  let W=Math.min(document.querySelector('.wrap').clientWidth-28,530);
  if(LAND.matches){W=Math.max(180,Math.min(window.innerHeight-46,(window.innerWidth-190-60-90-70)/2))}
  b.style.width=(W+8)+'px';
  b.style.setProperty('--cs',(W/N)+'px');
}
function drawPlan(){
  const L=cur,S=st(L.n),N=L.size;let b=document.getElementById('plan');
  sizeBoard(b,N); const real=b; b=document.createElement('div');
  // conflicts
  const rows={},cols={};
  for(const k in S.place){const [r,c]=S.place[k];rows[r]=(rows[r]||0)+1;cols[c]=(cols[c]||0)+1}
  const occ={};for(const k in S.place){occ[S.place[k].join(',')]=+k}
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const el=document.createElement('div');el.className='cell';
    const room=L.rooms[L.grid[r][c]];el.style.background=room.color;
    cellBase(L,el,r,c,false);
    const o=L.objs[r][c];
    if(o){ if(BLOCK.has(o))el.classList.add('block');
      el.innerHTML=objHTML(o);
    }
    const key=r+','+c;
    if(key in occ){const i=occ[key],p=L.people[i];
      el.insertAdjacentHTML('beforeend',`<div class="pawn ${S.hints.includes(i)?'lock':''}" style="background:${p.bg}">${p.av}<i>${p.name[0]}</i></div>`);
      if(rows[r]>1||cols[c]>1)el.classList.add('conf');
    }
    el.onclick=()=>tapPlan(r,c);
    b.appendChild(el);
  }
  // windows
  for(const [r,c,s] of L.windows){
    const d=document.createElement('div');d.className='win';const u=100/N;
    if(s==='n'||s==='s'){d.style.left=(c*u+u*.2)+'%';d.style.width=(u*.6)+'%';d.style.height='6px';d.style[s==='n'?'top':'bottom']='-5px'}
    else{d.style.top=(r*u+u*.2)+'%';d.style.height=(u*.6)+'%';d.style.width='6px';d.style[s==='w'?'left':'right']='-5px'}
    b.appendChild(d);
  }
  // labels: en una casilla sin muebles (para no tapar nada); si no hay, la que menos tape
  const cs=parseFloat(real.style.getPropertyValue('--cs'))||40;
  L.rooms.forEach((rm,i)=>{
    const span=Math.max(1,Math.ceil((rm.name.length*6.2+12)/cs));
    let best=null,bestScore=1e9;
    for(let r=N-1;r>=0;r--)for(let c=0;c<N;c++){
      if(L.grid[r][c]!==i)continue;
      let sc=0;for(let k=0;k<span;k++){const cc=c+k;if(cc>=N){sc+=1;continue}if(L.grid[r][cc]!==i)sc+=0.5;if(L.objs[r][cc])sc+=10}
      sc+=(N-1-r)*0.01+c*0.001;
      if(sc<bestScore){bestScore=sc;best=[r,c]}
    }
    const d=document.createElement('div');d.className='lbl';d.textContent=rm.name;const u=100/N;
    d.style.left=`calc(${best[1]*u}% + 2px)`;d.style.top=`calc(${(best[0]+1)*u}% - 15px)`;
    if(bestScore>=10)d.style.opacity='.75';
    b.appendChild(d);
  });
  real.replaceChildren(...b.childNodes);
}
function drawNotes(){
  const L=cur,S=st(L.n),N=L.size;const real=document.getElementById('notes');
  sizeBoard(real,N);const b=document.createElement('div');
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const el=document.createElement('div');el.className='cell';
    if(L.objs[r][c]&&BLOCK.has(L.objs[r][c]))el.classList.add('blk');
    cellBase(L,el,r,c,true);
    const n=noteOf(S,r*N+c);
    if(n){
      if(n.b)el.innerHTML=`<span class="mk l">${n.b}</span>`;
      else{
        let h='';
        if(n.m)h+=`<span class="mk ${n.m}">${n.m==='x'?'✕':'●'}</span>`;
        if(n.s&&n.s.length){const order=L.people.map(p=>p.name[0]);
          h+=`<div class="smg ${n.m?'dim':''}">`+order.map(l=>`<span>${n.s.includes(l)?l:''}</span>`).join('')+`</div>`;}
        el.innerHTML=h;
      }
    }
    el.onclick=()=>tapNote(r*N+c);
    b.appendChild(el);
  }
  real.replaceChildren(...b.childNodes);
}
function pick(i){selP=(selP===i?null:i);refreshSel()}
function noteOf(S,k){let n=S.notes[k];if(!n)return null;if(typeof n==='string'){n=n==='x'||n==='o'?{m:n,s:[]}:{b:n,s:[]};S.notes[k]=n}if(!n.s)n.s=[];return n}
function tapNote(k){
  const S=st(cur.n);pushHist();let n=noteOf(S,k)||{s:[]};
  if(tool==='e'){delete S.notes[k];save();drawNotes();return}
  if(tool==='x'||tool==='o'){n.m=n.m===tool?null:tool;if(n.m)n.b=null}
  else if(nmode==='b'){n.b=n.b===tool?null:tool;if(n.b)n.m=null}
  else{const i=n.s.indexOf(tool);if(i>=0)n.s.splice(i,1);else n.s.push(tool);n.b=null}
  if(!n.m&&!n.b&&!n.s.length)delete S.notes[k];else S.notes[k]=n;
  save();drawNotes();
}
function setMode(m){nmode=m;document.querySelectorAll('.modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m))}
function setTool(t){tool=t;document.querySelectorAll('.tool[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function refreshSel(){
  const L=cur,S=st(L.n);
  document.querySelectorAll('.card[data-i]').forEach(c=>c.classList.toggle('sel',+c.dataset.i===selP));
  document.querySelectorAll('.chip[data-i]').forEach(c=>{const i=+c.dataset.i;c.classList.toggle('on',i===selP);c.classList.toggle('placed',!!S.place[i])});
  const h=document.getElementById('hl');
  if(h)h.innerHTML=selP===null?'Toca a un sospechoso y luego una casilla para colocarlo. Toca a alguien del plano para quitarlo.':'Colocando a <b>'+L.people[selP].name+'</b>: toca una casilla.';
}
function setGuess(v){st(cur.n).guess=v===''?undefined:+v;save()}
function clearNotes(){pushHist();st(cur.n).notes={};save();drawNotes()}
function clearPlace(){pushHist();const S=st(cur.n);const keep={};S.hints.forEach(i=>keep[i]=S.place[i]);S.place=keep;save();drawPlan();refreshSel()}
function tapPlan(r,c){
  const L=cur,S=st(L.n);
  const occ=Object.keys(S.place).find(k=>S.place[k][0]===r&&S.place[k][1]===c);
  if(selP===null){
    if(occ!==undefined){ if(S.hints.includes(+occ)){toast('Esa la puso la pista 💡');return}
      pushHist();delete S.place[occ];save();drawPlan();refreshSel();}
    else toast('Primero elige a un sospechoso');
    return;
  }
  const o=L.objs[r][c];
  if(o&&BLOCK.has(o)){const cell=document.getElementById('plan').children[r*L.size+c];cell.classList.add('shake');setTimeout(()=>cell.classList.remove('shake'),300);toast('Ahí no se puede estar');return}
  if(S.hints.includes(selP)){toast('Esa ya la puso la pista 💡');return}
  if(occ!==undefined&&+occ!==selP&&S.hints.includes(+occ)){toast('Casilla ocupada');return}
  pushHist();
  if(occ!==undefined&&+occ!==selP)delete S.place[occ];
  S.place[selP]=[r,c];sfx('place');
  // auto-advance to next unplaced
  selP=null;
  save();drawPlan();refreshSel();
}
function boardCorrect(){
  const L=cur,S=st(L.n);
  return L.people.every((p,i)=>S.place[i]&&S.place[i][0]===L.sol[i][0]&&S.place[i][1]===L.sol[i][1]);
}
function check(){
  const L=cur,S=st(L.n);
  if(S.guess===undefined){toast('Elige quién es el asesino');return}
  const k=L.people[L.killer];
  if(L.daily)return checkDaily(L,S,k);
  if(S.guess===L.killer){
    const first=!S.solved;sfx('ok');
    if(first)stopTimer();
    S.solved=true;
    let bonus=0;
    if(first&&!S.revealed){bonus=timeBonus(L,S.time||0);S.bonus=bonus;S.pts=levelPoints(L,S)+bonus;}
    else if(first){S.pts=0}
    if(first&&!S.revealed){const R=meta();R.best=R.best||{};const sz=L.size;if(!R.best[sz]||S.time<R.best[sz])R.best[sz]=S.time;}
    save(); const newA=first?checkAch():[]; if(first)pushScore(); updWallet();
    const full=boardCorrect();
    modal(`<div class="big">🕵️‍♂️</div><h3>¡Caso resuelto!</h3><p><b>${k.name}</b> era ${k.fem?'la asesina':'el asesino'}. ${full?'Y además has colocado a todo el mundo perfecto. 👌':'(El plano no está completo o tiene fallos; puedes ver la solución si quieres.)'}</p>${first?`<p>${S.pts?`<b>+${S.pts} puntos</b> 🏆`:'Como viste la solución, este caso no suma puntos.'}${solvedCount()%2===0?' <b>+1 pista 💡</b>':''}</p>`:''}${first&&!S.revealed?`<p>⏱️ Tiempo: <b>${fmtTime(S.time||0)}</b>${bonus?` · <b>+${bonus}</b> por rapidez ⚡`:''}</p>`:''}${newA.map(a=>`<p>🏅 Logro desbloqueado: <b>${a.i} ${a.t}</b></p>`).join('')}
    <div class="row">${L.n<LEVELS.length?`<button class="btn primary" onclick="closeModal();openLevel(${L.n+1})">Siguiente caso ▶</button>`:''}<button class="btn" onclick="closeModal();menu()">Casos</button></div>`);
  }else{
    sfx('fail');if(!S.solved){S.fails=(S.fails||0)+1;save()}
    const placed=Object.keys(S.place).length, wrong=Object.keys(S.place).filter(i=>S.place[i][0]!==L.sol[i][0]||S.place[i][1]!==L.sol[i][1]).length;
    modal(`<div class="big">❌</div><h3>No es ${L.people[S.guess].name}</h3><p>Repasa las pistas. ${placed?`En el plano tienes <b>${wrong}</b> de ${placed} personas mal colocadas.`:''}</p><button class="btn primary" onclick="closeModal()">Seguir investigando</button>`);
  }
}
const START_HINTS=3;
function meta(){if(!store.meta)store.meta={spent:0};return store.meta}
function solvedCount(){return LEVELS.filter(l=>store[l.n]&&store[l.n].solved).length}
function hintsEarned(){return START_HINTS+Math.floor(solvedCount()/2)}
function hintsLeft(){return Math.max(0,hintsEarned()-meta().spent)}
function updWallet(){document.querySelectorAll('.wl').forEach(e=>e.textContent='('+hintsLeft()+')');document.querySelectorAll('.wl2').forEach(e=>e.textContent=hintsLeft())}
function hint(){
  const L=cur,S=st(L.n);
  if(hintsLeft()<1){toast('No te quedan pistas. Resuelve 2 casos para ganar otra');return}
  const cand=L.people.map((p,i)=>i).filter(i=>!L.people[i].victim&&i!==L.killer&&!S.hints.includes(i));
  if(!cand.length){toast('No quedan más pistas');return}
  const i=cand[Math.floor(Math.random()*cand.length)];
  // remove anyone in that cell
  for(const k in S.place){if(S.place[k][0]===L.sol[i][0]&&S.place[k][1]===L.sol[i][1])delete S.place[k]}
  sfx('hint');S.place[i]=L.sol[i].slice();S.hints.push(i);meta().spent++;save();updWallet();pushScore();drawPlan();refreshSel();toast('💡 '+L.people[i].name+' colocad'+(L.people[i].fem?'a':'o'));
}
function reveal(){
  const S=st(cur.n);
  if(S.revealed){doReveal();return}
  if(hintsLeft()<5){modal(`<h3>Te faltan pistas</h3><p>Ver la solución cuesta <b>5 pistas 💡</b> y tienes <b>${hintsLeft()}</b>. Ganas 1 pista cada 2 casos resueltos.</p><button class="btn primary" onclick="closeModal()">Vale</button>`);return}
  modal(`<h3>¿Ver la solución?</h3><p>Te costará <b>5 pistas 💡</b> (tienes ${hintsLeft()}) y este caso ya no sumará puntos.</p><div class="row"><button class="btn primary" onclick="doReveal()">Sí, enséñamela</button><button class="btn" onclick="closeModal()">No, sigo</button></div>`);
}
function doReveal(){
  const L=cur,S=st(L.n);closeModal();
  if(!S.revealed){meta().spent+=5;}
  S.revealed=true;
  L.people.forEach((p,i)=>S.place[i]=L.sol[i].slice());save();updWallet();pushScore();drawPlan();refreshSel();
  const k=L.people[L.killer];toast(`${k.fem?'La asesina':'El asesino'} era ${k.name}`);
}

let myName=null;try{myName=localStorage.getItem('mierdoku_name')}catch(e){}
function levelPoints(L,S){const base=(L.size-4)*10;return Math.max(5,base-2*(S.fails||0))}
function myPoints(){const d=meta().daily||{};return LEVELS.reduce((a,l)=>a+((store[l.n]&&store[l.n].solved&&store[l.n].pts)||0),0)+Object.values(d).reduce((a,x)=>a+(+x.pts||0),0)}

let DB=null,USER=null,myId=null,board=[],boardState='loading',canWrite=true;
async function initOnline(){
  try{
    if(!window.claude||!window.claude.use){boardState='off';return}
    DB=await window.claude.use('db');USER=await window.claude.use('user');
    if(!DB||!USER){boardState='off';return}
    myId=await USER.id();
    await syncMine();
    const timer=setTimeout(()=>{if(boardState==='loading'){boardState='slow';refreshRank()}},10000);
    DB.collection('scores').orderBy('points','desc').limit(200).onSnapshot(snap=>{
      clearTimeout(timer);boardState='ok';
      board=snap.docs.map(d=>({id:d.id,...(d.data()||{})}));refreshRank();
    },err=>{clearTimeout(timer);boardState='off';refreshRank()});
    pushScore();
  }catch(e){boardState='off'}
}
async function syncMine(force){
  if(!DB||!myId)return;
      try{const d=await DB.doc('scores/'+myId).get();
        if(d.exists){const x=d.data()||{};
          if((force||!myName)&&x.name){myName=String(x.name);try{localStorage.setItem('mierdoku_name',myName)}catch(e){}}
          const sv=x.solved||{};let ch=false;
          if((+x.spent||0)>meta().spent){meta().spent=+x.spent;ch=true}
          if(x.daily&&typeof x.daily==='object'){const md=meta().daily=meta().daily||{};for(const k in x.daily){if(!md[k]){md[k]=x.daily[k];ch=true}}}
          if(x.best&&typeof x.best==='object'){const mb=meta().best=meta().best||{};for(const k in x.best){if(!mb[k]||x.best[k]<mb[k]){mb[k]=x.best[k];ch=true}}}
          if(x.ach&&typeof x.ach==='object'){const ma=meta().ach=meta().ach||{};for(const k in x.ach){if(!ma[k]){ma[k]=x.ach[k];ch=true}}}
          for(const k in sv){const s=st(+k);if(!s.solved){s.solved=true;s.pts=+sv[k]||0;ch=true}}
          if(ch){save();if(!cur)menu()}
        }}catch(e){}
}
let pushing=false,pushAgain=false;
async function pushScore(){
  if(!DB||!myId||!myName||!canWrite)return;
  if(pushing){pushAgain=true;return}
  pushing=true;
  const solved={};LEVELS.forEach(l=>{const s=store[l.n];if(s&&s.solved)solved[l.n]=s.pts||0});
  const body={name:myName,points:myPoints(),count:Object.keys(solved).length,solved,spent:meta().spent,hints:hintsLeft(),medals:Object.keys(meta().ach||{}).length,ach:meta().ach||{},dailyCount:Object.keys(meta().daily||{}).length,daily:meta().daily||{},best:meta().best||{},updated:new Date().toISOString()};
  try{await DB.doc('scores/'+myId).set(body)}
  catch(e){if(e&&e.code==='invalid_argument'){canWrite=false;refreshRank()}}
  pushing=false;if(pushAgain){pushAgain=false;pushScore()}
}

const PROG=[[45,[57,60,64]],[41,[57,60,65]],[38,[57,62,65]],[40,[56,59,64]],[45,[57,60,64]],[48,[55,60,64]],[38,[57,62,65]],[40,[56,59,62,64]]];

function schedule(){
  if(!AC)return;const spb=60/88/2; // corcheas a 88 bpm
  while(nextT<AC.currentTime+.4){
    const bar=Math.floor(step/8)%PROG.length,beat=step%8,[bass,ch]=PROG[bar];
    if(beat===0||beat===4)note(musicGain,mtof(bass),nextT,spb*3.5,'triangle',.22,.02);
    const arp=ch[[0,1,2,1,0,1,2,1][beat]%ch.length];note(musicGain,mtof(arp),nextT,spb*1.6,'sine',.07,.005);

  <h1 class="case">💬 Chat de detectives</h1>
  <div class="chatBox" id="chatBox">${chatHTML()}</div>
  <form class="composer" onsubmit="sendMsg(event)"><input id="msgIn" maxlength="500" placeholder="Escribe un mensaje…" autocomplete="off"><button class="btn primary" type="submit">Enviar</button></form>`;
  const b=document.getElementById('chatBox');b.scrollTop=b.scrollHeight;window.scrollTo(0,0);
}
let sending=false;
async function sendMsg(e){
  e.preventDefault();const i=document.getElementById('msgIn');const v=(i.value||'').trim();
  if(!v||sending)return;
  if(!DB||!myId){toast('Sin conexión');return}
  if(!myName){askName();return}
  sending=true;
  try{await DB.collection('chat').add({uid:myId,name:myName,text:v.slice(0,500),ts:Date.now()});i.value=''}
  catch(err){toast(err&&err.code==='invalid_argument'?'No tienes permiso para escribir en el chat':err&&err.code==='quota_exceeded'?'El chat está lleno':'No se pudo enviar, inténtalo otra vez')}
  sending=false;
}
const APP_VERSION=9999;
window.appBack=function(){
  if(document.getElementById('mbg').style.display==='flex'){closeModal();return true}
  if(cur||document.getElementById('rankBox')||document.getElementById('chatBox')){menu();return true}
  return false;
};
let updInfo=null;
async function checkUpd(){try{if(window.__checkUpdate){updInfo=await window.__checkUpdate(APP_VERSION);if(updInfo&&!cur)menu()}}catch(e){}}
initOnline();checkUpd();
window.addEventListener('resize',()=>{if(cur){drawPlan();drawNotes()}});
if(LAND.addEventListener)LAND.addEventListener('change',()=>{if(cur)render()});
menu();
</script>
</body>
</html>
